; Origin (rule 13, decision D22): the project's fork of Community-Patch-DLL, branch claude/shell-gates-d8e422,
; path experiments/shell-gates/compositor/shell_composite.ini, copied at branch head c60138b82 (file last changed in a9d8328e2).
; Copied into shell/composite/shell_composite.ini on 2026-11-10 (issue 3001); later changes are in this repository's history.
; shell_composite.ini - read from the folder of shell_composite.dll at load and
; re-read whenever the file changes (live A/B switching). Every key can be
; overridden by an environment variable (VPSHELL_<KEY in upper case>), which wins.
; Issue 0148: everything the DLL writes (shell_composite.log, the per-frame CSVs, shots) goes to VPSHELL_OUT_DIR when it is
; set, else beside the DLL. The proxy sets it to <user folder>\Logs for the product composite: the EXE watches the whole
; <user folder>\MODS tree and stalls ~150 ms on every write under it. The ini and the trigger files stay beside the DLL.
; Ticket 0490: one truth. The DLL's built-in defaults (shell_composite.cpp struct Config) equal every value below, so a
; missing key, or a missing ini, gives this same configuration; change a value here and there together
; (shell/tests/test_config_defaults.py fails otherwise). The DLL logs every value it uses ("values used"), how this file
; differs from the defaults, and a missing or unreadable file (CONFIG ERROR, once). The installer ships this file.
[composite]
; off = every inline hook disabled (prologues restored) | passthrough = hooks installed, nothing drawn | composite
mode=composite
; clear    = after the first ClearRenderTargetView of the back buffer each frame (default)
; nthclear = after the N-th ClearRenderTargetView of ANY render target each frame (see nth)
; omset    = at the first OMSetRenderTargets that binds the back buffer each frame
; present  = just before Present, on top of everything (debug)
; exec     = after the N-th ExecuteCommandList on the immediate context (the Gate 3 live setting was nth=34)
; tagged   = by command-list tags (issue 3006): see tag_rule
insert=tagged
nth=1
; tagged insertion. Every deferred context's clears and render-target bindings are recorded and attached to its
; command list; the rule picks the list at ExecuteCommandList on the immediate context. All keys switch live.
; tag_rule: after  = after the executed list matching tag_match (default match: clear_bb)
;           before = before the tag_nth-th list matching tag_match after the first list matching tag_anchor
;                    (defaults: match bind_bb_dsv, anchor clear_bb = before the 3D pass)
;           inlist = drawn inside the deferred list right after its back-buffer clear (recording thread)
; tag_match / tag_anchor: comma list, all must hold: clear_bb clear_rt clear_dsv bind_bb bind_bb_dsv bind_rt
;   bind_rt_dsv nested, !tag (must not hold), dsv_fmt=N rt_fmt=N (DXGI_FORMAT numbers), ctx=K (deferred context
;   index in the order first seen), nclears>=N. An unknown token matches nothing (logged). tag_anchor=- : no anchor.
;   A value that is present but holds no token (" , ") or a character outside printable ASCII (an ini saved as UTF-8)
;   also matches nothing and is logged once as CONFIG ERROR (issue 3016; it used to match every list).
;   The trace (shell_composite.trace trigger) prints each executed list with its tags, so a rule can be written from
;   a trace or a RenderDoc capture without a rebuild.
; issue 3005 (live, D33, huge save, 2026-11-11): the game's scene clear is the one deferred list that clears the back
; buffer and its D24S8 depth (clear_bb|clear_dsv|bind_bb_dsv); after it come the landmark/city lists, then the units,
; then the UI list (bind_bb without depth). tag_rule=after with the default match puts the world under all of them.
tag_rule=after
tag_match=
; tag_anchor: leave the key out for the rule's default (before: clear_bb, after: none); "-" or an empty value = no
; anchor (an empty value is NOT the default). Example: tag_anchor=clear_bb
tag_nth=1
; 1 = keep a list's tags after it executed (for command lists executed more than once); 0 = forget them
tag_keep=0
; 1 = a swap chain created through IDXGIFactory becomes the target at its first Present (no 2 s gap) when it presents to
;     the target's window or the target's window is gone (issue 3017); a chain of another window never takes it
;     (only the 2 s silence rule hands over when the target stops presenting)
adopt_on_create=1
; kill switches, one per hooked method group (MinHook enable/disable, live); mode=off disables all
hook_present=1
hook_resize=1
hook_create_swapchain=1
hook_create_deferred=1
hook_clear=1
hook_clear_dsv=1
hook_omset=1
hook_finish=1
hook_exec=1
; issue 4752: every hook of the unit-draw filter (shader creation, VS/PS binds, every draw entry; see unit_filter below)
hook_units=1
; ticket 4874: the model tap's own hooks (CreateBuffer, CreateTexture2D: the content hashes of the mesh key; Map, Unmap:
; the copy of the buffers a city or landmark draw reads); the model filter's draws and binds are hook_units'
hook_models=1
; AcquireSync(1, timeout_ms): 0 = never wait, draw the previous copy if no new frame. Clamped to 0..50 ms (issue 3014;
; a value outside is logged as CONFIG ERROR, a negative one gives 0). No wait while the server is STALE, while it has
; replaced the texture or a resize is pending, nor after 8 timeouts in a row until a frame arrives again.
timeout_ms=0
; opaque | alpha (straight alpha from the server's texture)
blend=opaque
; 1 = stop drawing when the server heartbeat is older than stale_ms
hide_when_stale=0
stale_ms=1000
; 1 = ask the server for a texture the size of the back buffer
request_resize=1
stats_ms=1000
; log every clear / OMSetRenderTargets for this many frames after adopting a swap chain
trace_frames=2
; issue 3007: read the EXE's camera (view/projection globals, wrap views, view mode, viewport, grid constants) at
; every Present of the target and publish it into the section's camera block (shell_shared.h VPShellCamera). Read only,
; never a write into the EXE. Validated once at load (TimeDateStamp 0x546CD0A8 + the byte patterns of
; common/exe_camera.h, rebased on the module base); a refused EXE is never read. 0 = kill switch (live): status OFF.
camera=1
; test only: stall = count Presents but publish nothing (the server's stale detector must fire);
;            corrupt = shift view 0 by 40 units and still say OK (the server's own consistency check must fire)
;            late = after each new valid grid the first camera_test_late reads say INCONSISTENT (ticket 0408: a first
;                   load, where the map view comes up after the grid)
camera_test=
camera_test_late=20
; issue 3203 (epic 3200): the height-field tap. 1 = once per map load (grid seq changed, gridValid 1, camera OK for
; tap_delay_frames Presents) a worker thread copies the EXE's GridHeightmap (0xD91270: object, directories, pools of both
; layers; read only, SEH-guarded, bounds-checked) into a pagefile-backed section Local\VPShellTap.<pid>.<load>.<copy> in
; the C5HF format and publishes it in the section's tap block (shell_shared.h VPShellTap); the section is closed on the
; server's ack or after tap_ack_timeout_ms. Huge 128x80: 126 MiB of system commit while it exists (no address space is
; kept in the EXE: views of at most tap_chunk_kb, unmapped at once). Live: 0 publishes state OFF.
; issue 3313: shipped 1, the product path's value (server.exe's terrain needs the height field; 3308's and 3311's
; product runs set tap=1 by hand). A test that does not exercise the tap sets tap=0 itself (shell/tests fixtures).
tap=1
tap_ack_timeout_ms=60000
tap_delay_frames=30
; and this many frames with the scene-clear list (back buffer + depth cleared in one list) since the grid changed: the
; load screen has none, and on a reload in the same process the camera stays OK through it. 0 = not required (stand-in)
tap_scene_frames=30
; ticket 0408: 1 = on the first load in a process (the camera was never OK on a valid grid before and comes up only after
; the new grid is valid: the map view's set-up at the end of the load) neither count above applies: the copy starts after
; tap_first_delay_frames Presents with the camera OK, under the load screen, so the field is there before the click. The
; water tap follows the same rule. Reloads keep both counts. 0 = both counts on every load (before 0408)
tap_first_load=1
tap_first_delay_frames=3
; 1 = the material byte layer too (C5HF flag bit 1; Huge +42 MiB)
tap_byte_layer=1
tap_chunk_kb=4096
; test only (test_host has no field): synth | small = a synthetic field in this DLL's own memory; bad-size, bad-tiles,
; bad-state, bad-index, null-dir, wrap-ptr, bad-dir, bad-pool, too-big, change, bad-section, not-ready = hostile objects
; (shell/tests/test_tap.py). Empty = the EXE's own field. tap_test_load=N: a change simulates a new map load.
tap_test=
tap_test_load=0
; issue 3208 (diagnostic, live): 1 = record the EXE's ClearDepthStencilView calls (flags, value, view format and size)
; and, at every FinishCommandList with a depth view bound, the list's last depth-stencil state and viewport depth range,
; plus the immediate context's at the insertion; logged as "depth:" tables every 5 s. Get* calls only, nothing changed.
depth_probe=0
; issue 9039 (diagnostic): 1 = time each frame from the EXE's UpdateViews (an inline hook on d3dx9_42!D3DXMatrixInverse
; that fires only for UpdateViews' own call into &g_InvView[0]; validated against the EXE's bytes first, refused otherwise)
; to the execution of the scene-clear list; one row per Present in shell_composite.lsprobe.csv, "lsprobe 1s:" lines.
lockstep_probe=0
; issue 3304 (epic 3300; shell/common/vp_frame.h, shell/README.md "Lockstep"). lockstep=1: the camera is published at
; UpdateViews (the hook above) with frame id F, and the insertion waits for F up to lockstep_bound_us after the publish
; (0..10000, 0 = never wait), else draws the previous picture (a miss); after lockstep_giveup misses in a row (1..1000)
; no wait until a frame is ready without one. handover=v3 (keyed mutex + copy; the server must write the depth block:
; shell_server.exe --depth 1) or ring (shell/frame; ring_slots 2..4, ring_sync fence|cpu). depth_write=1: the server's
; depth of the drawn frame into the scene-clear list's depth view (tag_rule=after). lockstep_csv=1: per-frame rows in
; shell_composite.lockstep.csv. lockstep_check=1: the camera read again at Present and compared (premise 3).
; Any of lockstep, handover=ring, depth_write needs an insertion on the immediate context (not tag_rule=inlist).
; issue 3312: shipped with the product path's values (the proxy writes render_handover=ring for server.exe, issue 3308);
; a test or a run with shell_server.exe's version-3 hand-over sets handover=v3 lockstep=0 depth_write=0 itself.
; ticket 0675 (2026-11-22): lockstep_bound_us 8000 (was 3400, the terrain-only server turnaround of 9039): with units and
; models on, the server's frame passes 3400 us in 46-54 % of frames at 30 fps (research/05-graphics-composition/
; pan-coherence.md 2). Equals VPFRAME_BOUND_US_DEFAULT (shell/common/vp_frame.h; ticket 0490).
lockstep=1
lockstep_bound_us=8000
lockstep_giveup=8
; ticket 0691 (D242, 2026-11-23): lockstep_mode=exact (the default): the insertion waits for the frame of its own camera
; with no frame-time bound and no give-up (lockstep_bound_us and lockstep_giveup are not used); the wait ends only when
; that frame is ready, the server is dead (process ended, another pid, FAILED / STOPPED, magic 0) or HUNG: its heartbeat
; older than lockstep_hung_ms, or no new frame of any id for that long while the heartbeat ticks. A hung end is one LOUD
; line and the proxy's failure route (report, vp64helper's popup; D118/D240). No message pump while waiting: a wait over
; 5 s shows Windows' "Not Responding" mark on the game window until the frame ends.
; lockstep_mode=bounded: the bound and give-up above, for tests and A/B runs only. lockstep_hung_ms 2000..120000, default
; 30000 (render-thread stalls by render.log writes of up to 30 s in 5054's report, 10.97 s in its repro, 7.4 s in
; research/05-graphics-composition/pan-coherence.md 3.2; tracker/issues/0691 design point 4).
; hung_sink_test=1 (tests only): with no proxy loaded, the call the proxy would get is logged.
lockstep_mode=exact
lockstep_hung_ms=30000
hung_sink_test=0
handover=ring
depth_write=1
lockstep_csv=0
lockstep_check=0
; ticket 0688 (epic 0686 P1): pacing=1: the frame-pacing instruments (shell/common/vp_pacing.h): world updates, world age
; and freezes per Present, "pacing 1s:" lines, a run-long "pacing totals:" line every 10 s and at exit, one "pacing
; freeze:" line per freeze of 50 ms or more, and the EXE's memory and video budget in "vidmem 10s:"; the main thread only
; counts, the control thread writes. 0 = off (the cost arm). research/08-performance/frame-pacing-instruments.md.
pacing=1
ring_slots=4
ring_sync=fence
section=Local\VPShellSection
; folder for back-buffer dumps (trigger: create an empty shell_composite.shot next to the DLL); empty = VPSHELL_OUT_DIR or
; the DLL's folder
shot_dir=
; epic 0167, issue 3703: the Terrain Overlay target tap (overlay_tap.cpp): every map frame the EXE's 2048 x 2048 overlay
; target (culture borders, highlights, selection, ranges, hex grid) and its OverlayProj matrices are copied into one of
; three shared textures that server.exe samples (about 67 MB of video memory, MC #703). 0 = the kill switch (state OFF).
; Diagnostics, not shipped: overlay_verify=N checks every N-th copy against a second read of the target in the same
; Present (blocks the render thread); overlay_fail_frames (30) map frames without a target before the install fails.
overlay_tap=1
; epic 0166, issue 4102: the decal tap (decal_tap.cpp): the EXE's TerrainDecalSystem records (roads, railroads, farm
; fields, improvement and city grounds, the river bed), their vertex bytes and texture names, copied into
; Local\VPShellDecal.<pid>.<generation> whenever they change (control block Local\VPShellDecalTap.<pid>, shell_decal_tap.h).
; 0 = the kill switch (state OFF; a test switch only, D118: the server ends a game that has no decals). Optional keys
; (defaults in decal_tap.h): decal_budget_ms, decal_settle_frames, decal_max_wait_ms, decal_net_ms, decal_max_kb.
decal_tap=1
; epic 0169, issue 4304 (ticket 0312): the model shadow map tap (shadow_tap.cpp): every map frame the EXE's ShadowBlur
; (q3 2048^2 / q2 1024^2 R16_UNORM, q1 ShadowRaw back-buffer-sized R16G16B16A16_FLOAT, q0 strength 0 without a copy), its
; ShadowMatrix0 per view and the factor [0xD90FA8] into one of three shared textures of Local\VPShellShadowTap.<pid>
; (shell_shadow_tap.h) for server.exe. 0 = the kill switch (state OFF); 1 since 4308 binds it in the scene (server.cfg render_shadow, default 1).
; Diagnostics, not shipped: shadow_verify=N reads the EXE's texture back with every N-th copy (blocks the render thread);
; shadow_fail_frames (30) map frames without a texture before the install fails.
shadow_tap=1
; epic 0169, issue 4307: the ice tap (ice_tap.cpp): once per load (and after an Ice_Reload) the EXE's IMMUTABLE ice VB and
; IB through staging copies, the chunk array with each chunk's draw record and the Ice object's fields +0xFE80..+0x1001F
; into Local\VPShellIce.<pid>.<generation> (control block Local\VPShellIceTap.<pid>, shell_ice_tap.h) for server.exe.
; 0 = the kill switch (state OFF); 1 since 4308 binds the ice in the scene (lead-0169, 2026-11-15). Optional keys (defaults in
; ice_tap.h): ice_settle_frames (30), ice_max_kb.
ice_tap=1
; ticket 0420: the forest tap (forest_tap.cpp): reads only the EXE's Forest system (its 20 tree layouts and the plot records)
; and writes them to <output folder>\forest_tap\forest_<pid>_<load>_<generation>.bin, the oracle of the server's trees
; (research/05-graphics-composition/trees.md 7). Does anything only with Forest on in config.ini (route B, a test
; configuration). 0 = off (the default). Optional keys (forest_tap.h): forest_poll_ms (500), forest_settle_polls (2),
; forest_min_write_ms (5000), forest_max_files (200).
forest_tap=0
; ticket 0339: the EXE's model draws read the server's fog mask (fow_models.cpp): the mask behind the white handle, FOWAnim
; at 0xDA1C40; the proxy loads the cloud base layer for it (it reads this key too). 0 = the white mask as before (models on
; seen plots fully lit). Optional keys (fow_models.h): fow_models_wait_ms (30000), fow_models_stale_ms (2000),
; fow_models_trace (0).
model_fow=1
; ticket 0490 (MC: every key the compositor reads, with its built-in value). The switches below were read before and
; took their defaults; they are written here so that this file states the whole configuration.
; epic 3600, issue 3603: the water tap (water_tap.cpp): the EXE's river and wave meshes once per load; 1 since 3608.
water_tap=1
; ticket 4553: the cut-mask tap (cut_tap.cpp): the EXE's plot mask grid on change into a section; 1 since 4554.
cut_tap=1
; ticket 0527 (D186): the farm builder guard (farm_guard.cpp). 1 = the EXE's farm builder is called through the composite,
; which checks the farm layout graph's free list after each call and stops calling the builder after the first bad
; result (LOUD line, farm-guard.log in the proxy's run folder). 0 = the builder's own listener word again (not after a
; bad result).
farm_guard=1
; ticket 4853 (epic 0528 D): 1 = the guard calls the EXE's farm builder (the game lays out the farm fields); 0 = it never
; does and counts the skipped calls (the server lays out and draws the farm fields). The proxy sets VPSHELL_FARM_BUILDER=0
; with VP64Options.ini [Renderer] ServerFarmFields = 1; leave this line at 1. 0 keeps the guard's node even with farm_guard=0.
farm_builder=1
; epic 3200, issue 3204: the tile-cache tap (bake_tap.cpp, diagnostic): the EXE's baked tile caches into shared textures.
bake_tap=0
; test only (issue 3013): fault_test = composite | present | exec | uv: one access violation in that place (the SEH guard
; must disable the DLL); hook_test = foreign: also try to hook functions outside d3d11/dxgi (must be refused). Empty = off.
fault_test=
hook_test=
; epic 0040, issue 4752: the unit-draw filter (unit_filter.cpp). auto = while the server's mode word says it draws the units
; (VPMODE_UNITS, latched once per frame at Present, used only while the server is alive: header magic, the word's writer is
; the header's server, heartbeat within stale_ms, mode=composite), the EXE's pass-0 unit draws (the table of
; shell/common/unit_programs.h) are not passed to d3d11. on = dropped whatever the word says, off = never dropped: TEST ONLY,
; logged at start. Test-only keys (unit_filter.h): unit_filter_fault, unit_filter_table.
unit_filter=auto
; epic 0561, ticket 4874: the model filter (unit_filter.cpp; research/05-graphics-composition/city-renderer.md 10). auto =
; while the server's mode word has VPMODE_CITIES / VPMODE_LANDMARKS (latched as the unit bit), a city or landmark
; colour-pass draw (shell/common/shell_model_scene.h) whose mesh key is in the server's identity set and whose tap record
; is complete is not passed to d3d11; the tap (shell/common/shell_model_tap.h) carries it to the server. on = the bits
; taken as set, off = never dropped: TEST ONLY, logged. model_tap_passed=1 (TEST ONLY) taps the passed draws too.
; model_tap_slot_kb: the size of one of the tap's three frame slots, a multiple of 64 in 256..16384 (else CONFIG ERROR and
; 4096). Test-only key (unit_filter.h): model_filter_fault.
model_filter=auto
model_tap_passed=0
model_tap_slot_kb=4096
; Not written here: tag_anchor (left out on purpose: absent means the tag rule's own default anchor, see tag_rule above;
; "-" or empty means no anchor) and each tap's optional tuning and test keys (decal_budget_ms, ice_settle_frames,
; overlay_verify, unit_filter_fault, ...), whose defaults are in the module headers named above.
