# Example of the machine settings file read by tools/release/settings.py (`<key> = <value>` lines, `#` comments).
# Copy it to deps/local-settings.ini, or name your copy with the environment variable C5_SETTINGS_FILE, and set the
# keys you need; each key's environment variable (in brackets) overrides the file. Every value below is an example.
# The release set itself needs none of this file: tools/export/cleanbuild.py (BUILDING.md) sets what it needs.

# [C5_EXE_TABLES] The folder of the per-build EXE address tables made from your own game EXE files by
# tools/exebuild/gen_table.py. Every build script needs it.
exe_tables = C:/vp64-work/exe-tables

# [C5_RENDER_GAME_DIR, C5_RENDER_EXE] A copy of the game folder and of its CivilizationV_DX11.exe (Steam build 4390913)
# for render/build.py --test; without them those tests are skipped.
# render_game_dir = C:/vp64-work/game-copy/Sid Meier's Civilization V
# render_exe = C:/vp64-work/game-copy/Sid Meier's Civilization V/CivilizationV_DX11.exe

# The release driver tools/release/take_release.py only:
# [C5_PINS_DIR] the folder of pinned builds the driver never writes under (required by the driver).
# pins_dir = C:/vp64-work/pins
# [C5_CLONES_DIR] the folder of your own clones the driver refuses as --fork (default: the repository's parent folder
# when it is named GitHub).
# clones_dir = C:/vp64-work/clones
# [C5_FORK_URL] the DLL fork's address written into candidate lock files.
# fork_url = https://github.com/<owner>/Community-Patch-DLL.git
# [C5_C5H] the civ5-headless folder (default <home>/Documents/civ5-headless).
# c5h = C:/vp64-work/civ5-headless
# [C5_CORE_DB] a pinned copy of the game's core database, named by its SHA-256 in tools/release/stages/testdata.py.
# core_db = C:/vp64-work/coredb/Civ5CoreDatabase-<sha8>.db

# [C5_PGO_DIR] the folder of the PGO profile that deps/dll.lock locks (`profile-file = <pgo_dir>/<name>`; the file is
# not in the repository). A release-pgo build refuses without it; a `release` build needs none.
# pgo_dir = C:/vp64-work/pgo
